plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('local.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseStore = signingProperties.getProperty('RELEASE_STORE_FILE')
def releaseStorePassword = signingProperties.getProperty('RELEASE_STORE_PASSWORD')
def releaseKeyPassword = signingProperties.getProperty('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStore && releaseStorePassword && releaseKeyPassword
def gitSha = {
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute([], rootProject.projectDir)
        def out = proc.text.trim()
        proc.waitFor() == 0 && out ? out : 'unknown'
    } catch (Exception ignored) { 'unknown' }
}
def readSetting = { String name ->
    providers.gradleProperty(name).orNull ?: System.getenv(name) ?: signingProperties.getProperty(name, '')
}

android {
    namespace 'com.mapcontrol'
    compileSdk 34
    // android.car (platform isteğe bağlı kitaplığı): spor hız kadranı PERF_VEHICLE_SPEED okuması (CarSpeedReader).
    useLibrary 'android.car'

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.mapcontrol"
        minSdk 29
        targetSdk 28
        versionCode 15
        versionName "1.4.7"
        buildConfigField 'String', 'GIT_SHA', groovy.json.JsonOutput.toJson(gitSha())
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'GLITCHTIP_DSN', groovy.json.JsonOutput.toJson(readSetting('GLITCHTIP_DSN') ?: '')
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStore)
                storePassword releaseStorePassword
                keyAlias signingProperties.getProperty('RELEASE_KEY_ALIAS', 'mapcontrol')
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    // Yeni launcher (Kotlin)
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation('io.sentry:sentry-android:8.24.0') {
        exclude group: 'io.sentry', module: 'sentry-android-ndk'
        exclude group: 'io.sentry', module: 'sentry-android-replay'
    }
    testImplementation 'junit:junit:4.13.2'
    // Android'in org.json'u birim testlerde taklit (stub) olduğundan gerçek uygulama: AutomationBackupTest için.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'

    def filamentVersion = '1.53.4'
    implementation "com.google.android.filament:filament-android:${filamentVersion}"
    implementation "com.google.android.filament:gltfio-android:${filamentVersion}"
    implementation "com.google.android.filament:filament-utils-android:${filamentVersion}"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Gizli API muafiyeti: BluetoothHeadsetClient (HFP istemci) yansıma çağrıları için (telefon arka ucu).
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
