plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('local.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseStore = signingProperties.getProperty('RELEASE_STORE_FILE')
def releaseStorePassword = signingProperties.getProperty('RELEASE_STORE_PASSWORD')
def releaseKeyPassword = signingProperties.getProperty('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStore && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.mapcontrol'
    compileSdk 34

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.mapcontrol"
        minSdk 29
        targetSdk 28
        versionCode 2
        versionName "1.2.4"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStore)
                storePassword releaseStorePassword
                keyAlias signingProperties.getProperty('RELEASE_KEY_ALIAS', 'mapcontrol')
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    def filamentVersion = '1.53.4'
    implementation "com.google.android.filament:filament-android:${filamentVersion}"
    implementation "com.google.android.filament:gltfio-android:${filamentVersion}"
    implementation "com.google.android.filament:filament-utils-android:${filamentVersion}"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
