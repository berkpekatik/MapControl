<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
{{FONT_FACE}}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #080c18; }
body {
  font-family: 'Outfit', sans-serif;
  color: #fff;
  position: relative;
  --a: #5c8bff; --b: #8f6cff; --bg1: #070b16; --bg2: #131c38;
}
body.p-morning { --a: #ffb37a; --b: #ff6f91; --bg1: #1c2138; --bg2: #4b2f50; }
body.p-day     { --a: #6cb6ff; --b: #5fe0cf; --bg1: #0d2036; --bg2: #18405f; }
body.p-evening { --a: #ff8a5c; --b: #b560ff; --bg1: #190f2e; --bg2: #402046; }
body.p-night   { --a: #5c8bff; --b: #8f6cff; --bg1: #070b16; --bg2: #131c38; }

.layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.sky { background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%); }

.blob {
  position: absolute; border-radius: 50%; opacity: 0;
  will-change: transform, opacity;
}
.blob.one {
  width: 110vmin; height: 110vmin; left: 50%; top: 42%;
  margin: -55vmin 0 0 -80vmin;
  background: radial-gradient(circle, var(--a) 0%, rgba(0,0,0,0) 64%);
  animation: blobIn 1.4s ease-out forwards, driftA 5s ease-in-out 1.4s infinite alternate;
}
.blob.two {
  width: 90vmin; height: 90vmin; left: 50%; top: 58%;
  margin: -45vmin 0 0 -10vmin;
  background: radial-gradient(circle, var(--b) 0%, rgba(0,0,0,0) 64%);
  animation: blobIn 1.8s ease-out .2s forwards, driftB 5.5s ease-in-out 2s infinite alternate;
}
@keyframes blobIn { from { opacity: 0; transform: scale(.7); } to { opacity: .55; transform: scale(1); } }
@keyframes driftA { from { transform: translate3d(-3vmin, 0, 0) scale(1); } to { transform: translate3d(5vmin, 3vmin, 0) scale(1.08); } }
@keyframes driftB { from { transform: translate3d(4vmin, 2vmin, 0) scale(1.05); } to { transform: translate3d(-4vmin, -3vmin, 0) scale(.96); } }

.ring {
  position: absolute; left: 50%; top: 46%;
  width: 46vmin; height: 46vmin; margin: -23vmin 0 0 -23vmin;
  border: .22vmin solid var(--a); border-radius: 50%;
  opacity: 0; will-change: transform, opacity;
  animation: ring 2.9s cubic-bezier(.2,.6,.3,1) infinite;
}
.ring.r2 { animation-delay: .95s; }
.ring.r3 { animation-delay: 1.9s; }
@keyframes ring { 0% { transform: scale(.35); opacity: .6; } 100% { transform: scale(2.1); opacity: 0; } }

.vignette { background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,.6) 100%); }

.stage {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 0 6vmin;
}
.in { opacity: 0; animation: rise .95s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translate3d(0, 3.2vmin, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }

.greeting {
  font-size: 3.4vmin; font-weight: 400; letter-spacing: .42em; text-transform: uppercase;
  color: rgba(255,255,255,.78); padding-left: .42em;
  animation-delay: .1s;
}
.clock {
  margin-top: 1.6vmin; font-size: 27vmin; line-height: 1; font-weight: 200; letter-spacing: -.03em;
  text-shadow: 0 0 6vmin rgba(0,0,0,.35);
  animation-delay: .3s;
}
.date {
  margin-top: 1.8vmin; font-size: 2.7vmin; font-weight: 400; letter-spacing: .24em; text-transform: uppercase;
  color: rgba(255,255,255,.66); padding-left: .24em;
  animation-delay: .5s;
}
.rule {
  margin-top: 4.2vmin; width: 9vmin; height: .4vmin; border-radius: .2vmin;
  background: linear-gradient(90deg, var(--a), var(--b));
  opacity: 0; transform-origin: 50% 50%;
  animation: draw .8s cubic-bezier(.2,.7,.2,1) .7s forwards;
}
@keyframes draw { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
.name {
  display: none; margin-top: 4.2vmin;
  font-size: 5.4vmin; font-weight: 300; letter-spacing: .08em;
  animation-delay: .9s;
}
.has-name .name { display: block; }
</style>
</head>
<body class="{{BODY_CLASS}}">
  <div class="layer sky"></div>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="layer vignette"></div>
  <div class="stage">
    <div class="greeting in">{{GREETING}}</div>
    <div class="clock in">{{TIME}}</div>
    <div class="date in">{{DAY}} &middot; {{DATE}}</div>
    <div class="rule"></div>
    <div class="name in">{{NAME}}</div>
  </div>
</body>
</html>
