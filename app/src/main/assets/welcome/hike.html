<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
{{FONT_FACE}}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1844; }
body { font-family: 'Outfit', sans-serif; color: #fff; position: relative; }

.layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.sky {
  background: linear-gradient(180deg, #181646 0%, #4a2d78 34%, #b24a7c 62%, #ff8f6b 84%, #ffc27a 100%);
}

.stars { opacity: .0; animation: starsIn 1.6s ease-out .2s forwards; }
.star {
  position: absolute; width: .45vmin; height: .45vmin; border-radius: 50%; background: #fff;
  left: var(--x); top: var(--y); opacity: .35; animation: twinkle 2.2s ease-in-out var(--l) infinite alternate;
}
@keyframes starsIn { to { opacity: 1; } }
@keyframes twinkle { from { opacity: .15; } to { opacity: .95; } }

.sun {
  position: absolute; left: 50%; top: 58%; width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,236,170,1) 0%, rgba(255,190,110,.85) 16%, rgba(255,120,110,.35) 38%, rgba(255,120,110,0) 66%);
  opacity: 0; will-change: transform, opacity;
  animation: sunIn 2.2s cubic-bezier(.2,.7,.2,1) .1s forwards;
}
@keyframes sunIn { from { opacity: 0; transform: translate3d(0, 9vmin, 0) scale(.85); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }

.ridge {
  position: absolute; left: -6%; width: 112%; will-change: transform;
}
.ridge svg { display: block; width: 100%; height: 100%; }
.ridge.far  { bottom: 22vh; height: 36vh; animation: shiftL 6s ease-in-out infinite alternate; }
.ridge.mid  { bottom: 12vh; height: 36vh; animation: shiftR 6s ease-in-out infinite alternate; }
.ridge.near { bottom: 0;    height: 34vh; animation: shiftL 6s ease-in-out infinite alternate; }
@keyframes shiftL { from { transform: translate3d(2.5%, 0, 0); } to { transform: translate3d(-2.5%, 0, 0); } }
@keyframes shiftR { from { transform: translate3d(-3.5%, 0, 0); } to { transform: translate3d(3.5%, 0, 0); } }

.mist {
  position: absolute; left: 0; right: 0; height: 22vh;
  background: linear-gradient(180deg, rgba(255,170,150,0) 0%, rgba(255,170,150,.28) 55%, rgba(255,170,150,0) 100%);
  opacity: 0; animation: fadeIn 2s ease-out .6s forwards;
}
.mist.m1 { bottom: 30vh; }
.mist.m2 { bottom: 14vh; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.shade { background: linear-gradient(180deg, rgba(10,8,34,.55) 0%, rgba(10,8,34,.18) 46%, rgba(10,8,34,0) 70%); }

.stage {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  text-align: center; padding: 8vh 6vmin 0;
}
.in { opacity: 0; animation: rise .95s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translate3d(0, 3.2vmin, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }

.greeting {
  font-size: 3.2vmin; font-weight: 400; letter-spacing: .42em; text-transform: uppercase;
  color: #ffe0c2; padding-left: .42em; animation-delay: .15s;
}
.clock {
  margin-top: 1.4vmin; font-size: 21vmin; line-height: 1; font-weight: 200; letter-spacing: -.03em;
  text-shadow: 0 .5vmin 4vmin rgba(20,10,50,.55);
  animation-delay: .35s;
}
.date {
  margin-top: 1.4vmin; font-size: 2.6vmin; font-weight: 400; letter-spacing: .24em; text-transform: uppercase;
  color: rgba(255,238,224,.82); padding-left: .24em; animation-delay: .55s;
}
.rule {
  margin-top: 3.2vmin; width: 9vmin; height: .4vmin; border-radius: .2vmin;
  background: linear-gradient(90deg, #ffd08a, #ff8f8f);
  opacity: 0; animation: draw .8s cubic-bezier(.2,.7,.2,1) .75s forwards;
}
@keyframes draw { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
.name {
  display: none; margin-top: 3.2vmin; font-size: 4.8vmin; font-weight: 300; letter-spacing: .08em;
  text-shadow: 0 .4vmin 3vmin rgba(20,10,50,.5); animation-delay: .95s;
}
.has-name .name { display: block; }
</style>
</head>
<body class="{{BODY_CLASS}}">
  <div class="layer sky"></div>
  <div class="layer stars">
    <i class="star" style="--x:8%;  --y:8%;  --l:-.2s"></i>
    <i class="star" style="--x:19%; --y:20%; --l:-1.1s"></i>
    <i class="star" style="--x:31%; --y:6%;  --l:-.7s"></i>
    <i class="star" style="--x:44%; --y:15%; --l:-1.6s"></i>
    <i class="star" style="--x:58%; --y:5%;  --l:-.4s"></i>
    <i class="star" style="--x:67%; --y:18%; --l:-1.3s"></i>
    <i class="star" style="--x:79%; --y:9%;  --l:-.9s"></i>
    <i class="star" style="--x:90%; --y:22%; --l:-1.8s"></i>
    <i class="star" style="--x:13%; --y:34%; --l:-.5s"></i>
    <i class="star" style="--x:86%; --y:36%; --l:-1.4s"></i>
  </div>
  <div class="sun"></div>
  <div class="ridge far">
    <svg viewBox="0 0 1600 360" preserveAspectRatio="none"><path fill="#7a3f77" d="M0 200 L110 150 L210 190 L330 100 L440 180 L560 130 L680 200 L800 110 L930 190 L1050 120 L1170 195 L1290 140 L1400 190 L1500 150 L1600 190 L1600 360 L0 360 Z"/></svg>
  </div>
  <div class="mist m1"></div>
  <div class="ridge mid">
    <svg viewBox="0 0 1600 360" preserveAspectRatio="none"><path fill="#4b2a63" d="M0 170 L90 210 L200 120 L320 200 L450 90 L580 190 L700 140 L820 215 L950 105 L1080 195 L1200 130 L1330 205 L1460 120 L1600 200 L1600 360 L0 360 Z"/></svg>
  </div>
  <div class="mist m2"></div>
  <div class="ridge near">
    <svg viewBox="0 0 1600 360" preserveAspectRatio="none"><path fill="#1c1236" d="M0 190 L120 120 L240 200 L370 80 L500 190 L620 150 L760 220 L900 100 L1040 200 L1160 140 L1300 215 L1440 110 L1600 200 L1600 360 L0 360 Z"/></svg>
  </div>
  <div class="layer shade"></div>
  <div class="stage">
    <div class="greeting in">{{GREETING}}</div>
    <div class="clock in">{{TIME}}</div>
    <div class="date in">{{DAY}} &middot; {{DATE}}</div>
    <div class="rule"></div>
    <div class="name in">{{NAME}}</div>
  </div>
</body>
</html>
