plugins { id 'com.android.application' }
android {
    namespace 'com.korulu.tiggo.preflight'
    compileSdk 34
    defaultConfig {
        applicationId 'com.korulu.tiggo.preflight'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    lint { abortOnError true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
